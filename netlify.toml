[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  # Non-secret config defaults appear in server code; keep GEMINI_API_KEY actively scanned.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL,ASSISTANT_DAILY_LIMIT,ASSISTANT_IP_DAILY_LIMIT,ASSISTANT_IP_RPM_LIMIT"

[[plugins]]
  package = "@netlify/plugin-nextjs"
